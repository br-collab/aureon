name: Supply chain security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  python-dependencies:
    name: Python dependency vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.lock.txt

  npm-dependencies:
    name: npm dependency vulnerabilities
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: "KYC Agent/aureon-kyc"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "KYC Agent/aureon-kyc/package-lock.json"
      - run: npm audit --omit=dev --audit-level=high

  npm-development-dependencies:
    name: npm development dependency vulnerabilities (one recorded exception)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: "KYC Agent/aureon-kyc"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "KYC Agent/aureon-kyc/package-lock.json"
      - name: Full dependency audit with the one recorded exception
        # SECURITY.md records one exception: GHSA-fc5q-39xc-vjpf, until 2027-03-31. Any other
        # high or critical advisory fails this job, and from 2027-03-31 that one does too.
        run: |
          set +e
          npm audit --audit-level=high --json > audit.json
          set -e
          node - <<'JS'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("audit.json", "utf8"));
          const excepted = "GHSA-fc5q-39xc-vjpf";
          const expired = new Date().toISOString().slice(0, 10) >= "2027-03-31";
          const blocking = new Set();
          for (const item of Object.values(report.vulnerabilities || {})) {
            for (const via of item.via || []) {
              if (typeof via !== "object" || !["high", "critical"].includes(via.severity)) continue;
              const id = String(via.url || via.source || via.title).split("/").pop();
              if (id === excepted && !expired) continue;
              blocking.add(`${id} (${via.severity}, ${via.name})`);
            }
          }
          const lines = ["### Development dependency audit", ""];
          lines.push(`- Recorded exception ${excepted}: ${expired ? "EXPIRED" : "active until 2027-03-31"}`);
          lines.push(blocking.size ? `- Blocking: ${[...blocking].join("; ")}` : "- Blocking: none");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          if (blocking.size) { console.error(lines.join("\n")); process.exit(1); }
          JS

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          version: 3.97.9
          extra_args: --results=verified,unknown

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: aureon.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aureon-sbom
          path: aureon.spdx.json
          retention-days: 30
