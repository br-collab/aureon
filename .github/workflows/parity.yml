name: Cato parity

# Runs parity/run_parity.py: the in-process Python twin
# (aureon/mcp/cato_client.py) against the exact Node decision core the public
# MCP server executes (gate_core.js in br-collab/Cato-FICC-MCP), on the golden
# vectors. Mirrored by .github/workflows/parity.yml in Cato-FICC-MCP, which
# runs the same harness from the other side.
#
# Cato is checked out at `main` by default, not pinned: the question this job
# answers is whether the two repositories as they stand agree. The daily run
# catches a doctrine change landing on the Cato side with no aureon push.
# Exit codes: 0 parity holds (known-failing vectors disclosed, not hidden),
# 1 parity violated, 2 not assessed — all non-zero codes fail the job.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      cato_ref:
        description: "Cato-FICC-MCP ref to compare against (branch, tag or SHA)"
        default: main

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the Node decision core (Cato-FICC-MCP)
        uses: actions/checkout@v4
        with:
          repository: br-collab/Cato-FICC-MCP
          ref: ${{ inputs.cato_ref || 'main' }}
          path: cato-mcp

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run parity harness
        run: python parity/run_parity.py

  # Python 3.11 install from requirements.lock.txt (AUR-I-16). Railway still
  # installs requirements.txt; the lock is what CI proves installs cleanly.
  core:
    name: Core (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10.1.0

      # Recompiling keeps every version already in the lock unless
      # requirements.txt now demands otherwise, so any difference means
      # requirements.txt changed without the lock being regenerated.
      - name: Lock matches requirements.txt
        run: |
          uv pip compile requirements.txt --python-version 3.11 -o requirements.lock.txt
          git diff --exit-code requirements.lock.txt

      # --no-deps: only what the lock names is installed; pip check then
      # fails if the locked set is not self-consistent.
      - name: Install from the lock
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements.lock.txt
          pip check

      # pytest is the one package not in the lock: requirements.lock.txt
      # mirrors what Railway installs, and the test runner is not deployed.
      - name: Install the test runner
        run: pip install "pytest==9.1.1"

      # Root-level suite: test_clearing_cockpit.py (12) and
      # test_security_hardening.py (6).
      - name: pytest
        run: pytest -q

      # Script checks exit non-zero on failure. test_security_hardening.py is
      # also collected by pytest above, and since W2-ADD-01 a failed check
      # fails there too; the script run reports every failed check at once.
      - name: C2 persistence
        run: python test_c2_persistence.py

      - name: DSOR bridge
        run: python test_dsor_bridge.py

      - name: Security hardening
        run: python test_security_hardening.py
