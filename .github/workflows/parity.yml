name: Cato parity

# Runs parity/run_parity.py: the in-process Python twin
# (aureon/mcp/cato_client.py) against the exact Node decision core the public
# MCP server executes (gate_core.js in br-collab/Cato-FICC-MCP), on the golden
# vectors. Mirrored by .github/workflows/parity.yml in Cato-FICC-MCP, which
# runs the same harness from the other side.
#
# Cato is checked out at `main` by default, not pinned: the question this job
# answers is whether the two repositories as they stand agree. The daily run
# catches a doctrine change landing on the Cato side with no aureon push.
# Exit codes: 0 parity holds (known-failing vectors disclosed, not hidden),
# 1 parity violated, 2 not assessed — all non-zero codes fail the job.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      cato_ref:
        description: "Cato-FICC-MCP ref to compare against (branch, tag or SHA)"
        default: main

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the Node decision core (Cato-FICC-MCP)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: br-collab/Cato-FICC-MCP
          ref: ${{ inputs.cato_ref || 'main' }}
          path: cato-mcp

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Run parity harness
        run: python parity/run_parity.py

  # Python 3.11 install from requirements.lock.txt (AUR-I-16). Railway still
  # installs requirements.txt; the lock is what CI proves installs cleanly.
  core:
    name: Core (Python 3.11)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # Recompiling keeps every version already in the lock unless
      # requirements.txt now demands otherwise, so any difference means
      # requirements.txt changed without the lock being regenerated.
      - name: Lock matches requirements.txt
        run: python scripts/compile_lock.py --check

      # Two different questions, two steps, kept apart on purpose.
      #
      # 1. Is the locked set self-consistent? --no-deps installs exactly what
      #    the lock names and nothing else; pip check then fails if those
      #    versions disagree with each other.
      - name: Install from the lock (no resolver — is the locked set consistent?)
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements.lock.txt
          pip check

      # 2. Is the lock installable at all? --no-deps bypasses the resolver, so
      #    it cannot see a conflict between two direct URLs for one package.
      #    That is finding W2B7-V-02: uv normalises a git pin to its commit,
      #    Atreides declares the same commit by tag, and pip compares direct
      #    URLs as strings, so it refused the whole file. scripts/compile_lock.py
      #    keeps the lock spelled as requirements.txt spells it; this step is
      #    what proves that worked. A clean environment, because the point is
      #    resolution, not whether something is already installed.
      - name: Install from the lock (with resolver — is the lock installable?)
        run: |
          python -m venv /tmp/lock-resolve
          /tmp/lock-resolve/bin/python -m pip install --upgrade pip
          /tmp/lock-resolve/bin/python -m pip install -r requirements.lock.txt

      # pytest is the one package not in the lock: the lock is compiled from
      # requirements.txt, which is the deploy input, and the test runner is not
      # deployed.
      #
      # What Railway actually installs: `requirements.txt`, not this lock.
      # `railway.json` in this repository selects the NIXPACKS builder and sets
      # the start command and `/api/snapshot` as the health check; `runtime.txt`
      # pins python-3.11.9; `Procfile` carries the same gunicorn line. All three
      # are tracked here. The lock exists so CI resolves a fixed set rather than
      # whatever is current, which is a reproducibility guarantee for the tests,
      # not a description of the deploy.
      - name: Install the test runner
        run: pip install "pytest==9.1.1"

      # Import the exact WSGI target used by Railway and exercise its configured
      # health route. This catches missing imports and boot-time wiring failures
      # before a merge can turn into a production 502.
      - name: Boot smoke (server:app + health route)
        env:
          AUREON_ADMIN_KEY: ci-boot-smoke
        run: |
          python - <<'PY'
          from server import app

          response = app.test_client().get("/api/snapshot")
          assert response.status_code == 200, response.status_code
          assert isinstance(response.get_json(), dict)
          print("PASS: server:app imported and /api/snapshot returned JSON")
          PY

      # Root-level suite: test_clearing_cockpit.py (12) and
      # test_security_hardening.py (6).
      - name: pytest
        run: pytest -q

      # Script checks exit non-zero on failure. test_security_hardening.py is
      # also collected by pytest above, and since W2-ADD-01 a failed check
      # fails there too; the script run reports every failed check at once.
      - name: C2 persistence
        run: python test_c2_persistence.py

      - name: DSOR bridge
        run: python test_dsor_bridge.py

      - name: Security hardening
        run: python test_security_hardening.py
